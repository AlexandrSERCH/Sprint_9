services:

  selenoid:
    image: aerokube/selenoid:latest
    environment:
      - DOCKER_API_VERSION=1.45
    ports:
      - "4444:4444"
    networks:
      - selenoid-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid
    command: >
      -conf /etc/selenoid/browsers.json
      -container-network selenoid-net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4444/status" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tests:
    build: .
    depends_on:
      selenoid:
        condition: service_healthy
    networks:
      - selenoid-net
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
      - PYTEST_EXTRA_ARGS=${PYTEST_EXTRA_ARGS:-}
    volumes:
      - ./allure-results:/app/allure-results
    command: >
      sh -c "pytest --alluredir=allure-results $$PYTEST_EXTRA_ARGS"

networks:
  selenoid-net:
    name: selenoid-net