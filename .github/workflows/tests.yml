name: Run Tests

on:
  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      marker:
        description: "Выберите какие тесты запустить"
        required: false
        default: All
        type: choice
        options:
          - All
          - UI
          - smoke
          - regress
          - recipes
          - users

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Selenoid browser images
        run: |
          docker pull selenoid/vnc_chrome:128.0
          docker pull aerokube/video-recorder:latest-release

      - name: Build test image
        run: docker compose build tests

      - name: Run tests
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          if [ -n "$MARKER" ]; then
            PYTEST_ARGS="-m $MARKER"
          else
            PYTEST_ARGS=""
          fi
          docker compose run --rm \
            -e PYTEST_EXTRA_ARGS="$PYTEST_ARGS" \
            -e SELENOID_VIDEO=false \
            tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 7

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenoid-video-${{ github.run_id }}
          path: selenoid-video/
          retention-days: 3
          if-no-files-found: ignore

      # Скачиваем историю предыдущих запусков из gh-pages
      - name: Download Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # Генерируем Allure report с историей
      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      # Публикуем отчёт в ветку gh-pages
      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.TOKEN_GITHUB }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Print report URL
        if: always()
        run: |
          echo ""
          echo "======[ Allure Report ]======"
          echo "🔗 https://AlexandrSERCH.github.io/Sprint_9/${{ github.run_number }}/"
          echo "============================="

      - name: Tear down
        if: always()
        run: docker compose down -v
